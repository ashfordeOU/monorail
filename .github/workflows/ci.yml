name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Run the Mac checks too (always on unless the SAVE_CI_MINUTES variable is true)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      - run: swift test

  macos:
    name: Build & test (macOS)
    # SAVE_CI_MINUTES (a repository variable) keeps Mac and Windows machines for full runs: a private
    # repository pays for them by the minute. Linux checks still run on every change.
    if: vars.SAVE_CI_MINUTES != 'true' || inputs.full
    runs-on: macos-15
    env:
      MONORAIL_SIGNING_CERT: ${{ secrets.MONORAIL_SIGNING_CERT || secrets.MACSLIDER_SIGNING_CERT }}
      MONORAIL_SIGNING_PASSWORD: ${{ secrets.MONORAIL_SIGNING_PASSWORD || secrets.MACSLIDER_SIGNING_PASSWORD }}
      MONORAIL_INSTALLER_CERT: ${{ secrets.MONORAIL_INSTALLER_CERT }}
      MONORAIL_INSTALLER_PASSWORD: ${{ secrets.MONORAIL_INSTALLER_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Use the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)"
          [ -n "$latest" ] && sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Docs are up to date
        # docs/ACTIONS.md and docs/SETTINGS.md are generated; the README art must be valid SVG.
        run: |
          python3 scripts/gen-docs.py --check
          for f in assets/readme/*.svg; do python3 -c "import sys, xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1])" "$f"; done
      - name: Throwaway signing certificate
        # Pull requests and forks have no secrets: still exercise the signing path.
        if: env.MONORAIL_SIGNING_CERT == ''
        run: |
          scripts/make-signing-cert.sh --out "$RUNNER_TEMP/throwaway"
          echo "MONORAIL_SIGNING_CERT=$(cat "$RUNNER_TEMP/throwaway/cert.p12.b64")" >> "$GITHUB_ENV"
          echo "MONORAIL_SIGNING_PASSWORD=$(cat "$RUNNER_TEMP/throwaway/password")" >> "$GITHUB_ENV"
      - name: Import signing certificate
        run: scripts/ci-import-signing-cert.sh
      - name: Build app
        run: scripts/build-app.sh
      - name: Self-test
        # Builds every Settings pane and checks actions, themes, languages and defaults (no permissions needed).
        run: dist/Monorail.app/Contents/MacOS/Monorail --self-test
      - name: Keep me Available check
        # Declaring user activity should reset the idle time Teams and Slack read. Prints the numbers;
        # never fails a runner without an input session.
        run: dist/Monorail.app/Contents/MacOS/Monorail --self-check-available
      - name: First-run screens
        # Draws the welcome tour and What's New (light and dark) for a look before release.
        run: dist/Monorail.app/Contents/MacOS/Monorail --render-screens dist/screens
      - uses: actions/upload-artifact@v5
        with:
          name: screens-${{ github.sha }}
          path: dist/screens/*.png
          retention-days: 14
      - name: Idle cost (battery check)
        # Runs the app for a minute doing nothing and reports what it costs. A window manager runs all
        # day, so this should stay tiny. (No Accessibility on CI: the engine waits, but every
        # background timer still runs.) Fails only when idle CPU or wake-ups are clearly too high.
        run: |
          app=dist/Monorail.app/Contents/MacOS/Monorail
          # No usage counts or update checks from CI.
          mkdir -p "$HOME/Library/Application Support/Monorail"
          echo '{"shareUsageStats":false,"checkForUpdates":false,"usageNoticeShown":true}' > "$HOME/Library/Application Support/Monorail/settings.json"
          "$app" > /dev/null 2>&1 &
          pid=$!
          sleep 20
          cpu() { ps -o time= -p "$pid" | awk -F'[:.]' '{ if (NF==3) print $1*60+$2+$3/100; else print $1*3600+$2*60+$3 }'; }
          before="$(cpu)"
          top -l 2 -s 60 -pid "$pid" -stats pid,cpu,idlew,mem,threads | tail -n 1 | tee idle.txt
          after="$(cpu)"
          kill "$pid" || true
          used="$(echo "$after - $before" | bc -l)"
          wakeups="$(awk '{print $3}' idle.txt)"
          echo "CPU over 60 s idle: ${used} s · idle wake-ups/s: ${wakeups} · $(awk '{print $4}' idle.txt) memory"
          echo "### Idle cost: ${used} s CPU per minute, ${wakeups} wake-ups/s, $(awk '{print $4}' idle.txt)" >> "$GITHUB_STEP_SUMMARY"
          awk -v u="$used" -v w="${wakeups:-0}" 'BEGIN { if (u > 1.5 || w > 30) { print "Idle cost is too high"; exit 1 } }'
      - name: App Store edition compiles
        # The sandboxed edition (docs/APP-STORE.md) leaves features out with #if APPSTORE; keep it building.
        run: swift build -Xswiftc -DAPPSTORE --scratch-path .build-appstore
      - name: Check signature
        run: |
          codesign --display --requirements - dist/Monorail.app 2>&1 | tee requirement.txt
          grep -q 'certificate leaf' requirement.txt
      - name: Install dmgbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg"
          "$RUNNER_TEMP/dmg/bin/pip" install --quiet dmgbuild
          echo "$RUNNER_TEMP/dmg/bin" >> "$GITHUB_PATH"
      - name: Package
        run: scripts/package.sh
      - uses: actions/upload-artifact@v5
        with:
          name: Monorail-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS
          if-no-files-found: error

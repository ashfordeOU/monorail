name: Website

# Publishes site/ (with the README art and launch images) to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["site/**", "assets/**", "scripts/mirror-releases.py", "scripts/render-docs.py", "scripts/site-build.py", "scripts/install.sh", "server/endpoint.txt", "quirks.json", "extensions/scripts/**", "docs/IT.md", "docs/ACTIONS.md", "docs/SETTINGS.md", "docs/COMPATIBILITY.md", "docs/AGENTS.md", "extensions/agent-skill/**", "SECURITY.md", "LICENSE", "TRADEMARKS.md", "scripts/perf-check.sh", "CHANGELOG.md", "docs/launch/FACT-SHEET.md", ".github/workflows/pages.yml"]
  workflow_dispatch:
  # Once a day as well, so the downloads on the site always match the newest release.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Assemble the site
        run: |
          mkdir -p public/assets
          cp -R site/. public/
          cp -R assets/readme assets/launch assets/features public/assets/
          cp assets/icon.png public/assets/icon.png
          # site/404.html is its own page (copied with the rest of site/).
          # The Agent Skill, for agents told to read it from the site.
          mkdir -p public/agents && cp extensions/agent-skill/monorail/SKILL.md public/agents/SKILL.md
          # The FAQ as structured data, so search results can show the answers (built from the page itself).
          python3 - public/index.html <<'PY'
          import html, json, re, sys
          path = sys.argv[1]
          page = open(path, encoding="utf-8").read()
          def text(fragment):
              return re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", "", fragment))).strip()
          faqs = re.findall(r"<details><summary>(.*?)</summary>(.*?)</details>", page, re.S)
          data = {"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [
              {"@type": "Question", "name": text(q), "acceptedAnswer": {"@type": "Answer", "text": text(a)}} for q, a in faqs]}
          tag = '<script type="application/ld+json">%s</script>\n</head>' % json.dumps(data, ensure_ascii=False).replace("</", "<\\/")
          page = page.replace("</head>", tag, 1)
          open(path, "w", encoding="utf-8").write(page)
          print("FAQ structured data: %d questions" % len(faqs))
          PY
          printf 'User-agent: *\nAllow: /\nSitemap: https://monorail.ashforde.org/sitemap.xml\n' > public/robots.txt
          base=https://monorail.ashforde.org
          {
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            for page in "" download/ changelog/ performance/ press/ support/ privacy/ docs/it/ docs/actions/ docs/settings/ docs/compatibility/ docs/agents/ docs/security/ docs/licence/ docs/trademarks/; do printf '<url><loc>%s/%s</loc></url>' "$base" "$page"; done
            printf '</urlset>\n'
          } > public/sitemap.xml
          # The press kit: screenshots, icon, the docking GIF and the fact sheet, in one zip.
          kit=$(mktemp -d)/Monorail-press-kit
          mkdir -p "$kit/screenshots"
          cp assets/launch/v17/0*.png "$kit/screenshots/"
          mkdir -p "$kit/screens" && cp site/img/time.webp site/img/ai-usage.webp site/img/switches.webp site/img/panel-light.webp site/img/clipboard-*.webp site/img/tools-*.webp "$kit/screens/"
          cp site/media/docking.mp4 "$kit/"
          cp assets/launch/v17/docking.gif "$kit/"
          cp assets/icon.png "$kit/monorail-icon-1024.png"
          cp site/icons/icon-512.png "$kit/monorail-icon-512.png"
          cp docs/launch/FACT-SHEET.md "$kit/FACT-SHEET.md"
          (cd "$(dirname "$kit")" && zip -qr "$GITHUB_WORKSPACE/public/press/monorail-press-kit.zip" Monorail-press-kit)
      - name: Build the changelog page
        # CHANGELOG.md (Keep a Changelog) becomes /changelog/ in the site's look:
        # headings, nested bullet lists, paragraphs, **bold**, [links](…) and `code`, all HTML-escaped.
        run: |
          mkdir -p public/changelog
          # The raw file too: the app reads a new version's notes from it before installing.
          cp CHANGELOG.md public/changelog/CHANGELOG.md
          python3 - CHANGELOG.md public/changelog/index.html <<'PY'
          import datetime, html, re, sys

          src, dest = sys.argv[1], sys.argv[2]
          lines = open(src, encoding="utf-8").read().splitlines()
          # Keeper isn't shown on Monorail's site for now: leave out the entries that mention it.
          lines = [l for l in lines if not (l.lstrip().startswith("- ") and "Keeper" in l)]
          # The App Store edition is parked (docs/APP-STORE.md): no mention of it on the site either.
          lines = [l.replace(" Not in the App Store edition.", "") for l in lines]
          lines = [l for l in lines if not (l.lstrip().startswith("- ") and "App Store edition" in l)]
          # Nor its name: drop the brackets and sentences that mention Signalbox, keep the rest of the entry.
          def unsignal(line):
              if "Signalbox" not in line:
                  return line
              line = re.sub(r"\s*\([^()]*Signalbox[^()]*\)", "", line)
              parts = re.split(r"(?<=[.!?])\s+", line)
              kept = " ".join(p for p in parts if "Signalbox" not in p)
              return kept if kept.lstrip().startswith("- ") or not line.lstrip().startswith("- ") else "- " + kept
          lines = [unsignal(l) for l in lines]
          # Edition markers: bullets for the App Store edition alone go, the comments themselves go, and so does
          # any sentence or bracket that names that edition (its working name was Station).
          text = "\n".join(lines)
          text = re.sub(r"(?m)^\s*- .*<!--\s*station\s*-->\s*\n?", "", text)
          text = re.sub(r"\s*<!--.*?-->", "", text, flags=re.S)
          lines = text.splitlines()
          HIDDEN = re.compile(r"\b(Station|Signalbox|App Store|Keeper)\b")
          def unedition(line):
              if not HIDDEN.search(line):
                  return line
              line = re.sub(r"\s*\([^()]*\b(Station|Signalbox|App Store|Keeper)\b[^()]*\)", "", line)
              if not HIDDEN.search(line):
                  return line
              bullet = line.lstrip().startswith("- ")
              parts = re.split(r"(?<=[.!?])\s+", line)
              kept = [x for x in parts if not HIDDEN.search(x)]
              if not kept or (bullet and not kept[0].lstrip().startswith("- ")):
                  return ""
              return " ".join(kept)
          lines = [unedition(l) for l in lines]
          REPO = "https://github.com/ashfordeOU/monorail"

          def inline(text):
              codes = []
              def keep(m):
                  codes.append("<code>" + html.escape(m.group(1)) + "</code>")
                  return "\x00%d\x00" % (len(codes) - 1)
              text = re.sub(r"`([^`]+)`", keep, text)
              text = html.escape(text, quote=True)
              # Guides published on the site; links to other files in the repository keep only their words.
              GUIDES = {"IT.md": "it", "ACTIONS.md": "actions", "SETTINGS.md": "settings", "COMPATIBILITY.md": "compatibility", "AGENTS.md": "agents",
                        "SECURITY.md": "security", "LICENSE": "licence", "TRADEMARKS.md": "trademarks"}
              def link(m):
                  href = m.group(2)
                  if "github.com/ashfordeOU/monorail" in href:
                      return m.group(1)
                  if not re.match(r"(https?://|mailto:|#)", href):
                      name = href.split("#")[0].rstrip("/").split("/")[-1]
                      if name in GUIDES:
                          return '<a href="../docs/%s/">%s</a>' % (GUIDES[name], m.group(1))
                      return m.group(1)
                  return '<a href="%s">%s</a>' % (href, m.group(1))
              text = re.sub(r"\[([^\]]+)\]\(([^)\s]+)\)", link, text)
              text = re.sub(r"\*\*(.+?)\*\*", r"<strong>\1</strong>", text)
              text = re.sub(r"(?<![\w*])\*([^*\s][^*]*?)\*(?![\w*])", r"<em>\1</em>", text)
              return re.sub("\x00(\\d+)\x00", lambda m: codes[int(m.group(1))], text)

          intro, releases = [], []
          cur = None            # the release being built: dict(version, date, body=[])
          out = intro           # where the next HTML goes
          stack = []            # indent levels of the open <ul>s
          item = None           # text of the list item being read
          para = []             # lines of the paragraph being read

          def flush_item():
              global item
              if item is not None:
                  out.append(inline(item))
                  item = None
          def flush_para():
              if para:
                  out.append("<p>" + inline(" ".join(para)) + "</p>")
                  para.clear()
          def close_lists():
              flush_item()
              while stack:
                  out.append("</li></ul>")
                  stack.pop()
          def close_all():
              close_lists()
              flush_para()

          for raw in lines:
              line = raw.rstrip()
              m_item = re.match(r"^( *)[-*+] +(.*)$", line)
              if not line.strip():
                  flush_item(); flush_para()
              elif line.startswith("# "):
                  close_all()
              elif line.startswith("## "):
                  close_all()
                  m = re.match(r"^## +\[?([^\]]+?)\]?(?: +[-–] +(\d{4}-\d{2}-\d{2}))?\s*$", line)
                  version, date = (m.group(1), m.group(2)) if m else (line[3:].strip(), None)
                  cur = {"version": version, "date": date, "body": []}
                  releases.append(cur)
                  out = cur["body"]
              elif re.match(r"^#{3,6} ", line):
                  close_all()
                  out.append("<h3>" + inline(line.lstrip("#").strip()) + "</h3>")
              elif m_item:
                  flush_para(); flush_item()
                  level = len(m_item.group(1)) // 2
                  while stack and stack[-1] > level:
                      out.append("</li></ul>")
                      stack.pop()
                  if stack and stack[-1] == level:
                      out.append("</li><li>")
                  else:
                      out.append("<ul><li>")
                      stack.append(level)
                  item = m_item.group(2)
              elif item is not None and raw.startswith(" "):
                  item += " " + line.strip()
              else:
                  close_lists()
                  para.append(line.strip())
          close_all()

          def slug(v):
              return "v" + re.sub(r"[^0-9A-Za-z.]+", "-", v).strip("-") if re.match(r"\d", v) else re.sub(r"[^a-z0-9]+", "-", v.lower()).strip("-")
          def nice(d):
              day = datetime.date.fromisoformat(d)
              return "%d %s %d" % (day.day, day.strftime("%B"), day.year)

          releases = [r for r in releases if "".join(r["body"]).strip()]
          articles, chips = [], []
          for i, r in enumerate(releases):
              v, sid = html.escape(r["version"]), slug(r["version"])
              numbered = bool(re.match(r"\d", r["version"]))
              meta, badge = [], ""
              if i == 0 and numbered:
                  badge = '<span class="latest">Latest</span> '
              if r["date"]:
                  meta.append('<time datetime="%s">%s</time>' % (r["date"], nice(r["date"])))
              if i == 0 and numbered:
                  meta.append('<a class="dl" href="/download/">Download</a>')
              articles.append('<article class="rel glass flat" id="%s"><header><h2><a href="#%s">%s</a></h2><p class="meta">%s</p></header><div class="body">%s</div></article>'
                              % (sid, sid, v, badge + " · ".join(meta), "\n".join(r["body"])))
              chips.append('<a href="#%s">%s</a>' % (sid, v))
          latest = releases[0] if releases else None

          page = """<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>What’s new in Monorail</title>
          <meta name="description" content="Every Monorail release, newest first: what was added, changed and fixed in the free Mac app.">
          <link rel="canonical" href="https://monorail.ashforde.org/changelog/">
          <!--#head-->
          <style>
          .rel { padding: clamp(22px, 3.5vw, 34px); border-radius: var(--r-l); margin-bottom: 16px; scroll-margin-top: 96px; }
          .rel header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
          .rel h2 { margin: 0; font-size: clamp(26px, 4vw, 34px); letter-spacing: -.035em; }
          .rel h2 a { color: var(--ink); }
          .rel h2 a:hover { text-decoration: none; color: var(--l2); }
          .meta { color: var(--ink3); font-size: 14.5px; }
          .meta a { color: var(--ink2); }
          .latest { display: inline-block; padding: 3px 10px; border-radius: 999px; font: 600 12px var(--font); color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, transparent); }
          .body > p { color: var(--ink2); margin-top: 12px; }
          .body h3 { margin: 26px 0 8px; font: 600 12px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); }
          .body ul { margin: 0; padding-left: 20px; }
          .body li { margin: 9px 0; color: var(--ink2); }
          .body li strong { color: var(--ink); font-weight: 600; }
          .body li::marker { color: var(--l2); }
          .body li li { font-size: 15.5px; }
          .toc .chips { display: flex; flex-wrap: wrap; gap: 6px; }
          .toc .chips a { padding: 4px 10px; border-radius: 999px; background: var(--glass2); border: 1px solid var(--hair); color: var(--ink2); font-size: 13px; font-variant-numeric: tabular-nums; }
          .toc .chips a:hover { color: var(--ink); text-decoration: none; }
          </style>
          </head>
          <body>
          <!--#header-->
          <main id="main" class="wrap">
            <section class="page-hero">
              <span class="eyebrow"><i></i>What’s new</span>
              <h1><span class="sheen">Every release,</span> <span class="light-text">newest first.</span></h1>
              <p class="lede">What was added, changed and fixed in each version of Monorail. Updates install themselves, or download the latest any time.</p>
              @@LATEST@@
            </section>
            <div class="toc-layout">
              <aside class="toc glass flat" aria-label="Versions"><b>@@COUNT@@ versions</b><nav class="chips">@@CHIPS@@</nav></aside>
              <div>@@ARTICLES@@</div>
            </div>
          </main>
          <!--#footer-->
          </body>
          </html>
          """
          latestline = ""
          if latest and re.match(r"\d", latest["version"]):
              latestline = '<p style="margin-top:22px;display:flex;gap:12px;flex-wrap:wrap;align-items:center"><a class="btn primary dl" href="/download/" data-smartdl><span data-dl-label>Download %s</span></a><span class="faint" style="font-size:14px">Latest: <a href="#%s">%s</a>%s</span></p>' % (html.escape(latest["version"]), 
                  slug(latest["version"]), html.escape(latest["version"]), " · " + nice(latest["date"]) if latest["date"] else "")
          for key, value in (("@@REPO@@", REPO), ("@@INTRO@@", "\n".join(intro)), ("@@LATEST@@", latestline),
                             ("@@COUNT@@", str(len(chips))), ("@@CHIPS@@", "".join(chips)), ("@@ARTICLES@@", "\n".join(articles))):
              page = page.replace(key, value)
          # A heading left with nothing under it (its entries were left out above) goes too.
          page = re.sub(r"<h3>[^<]*</h3>\s*(?=<h3|</div>)", "", page)
          open(dest, "w", encoding="utf-8").write(page)
          print("changelog: %d releases" % len(releases))
          PY
      - name: Publish the guides and the install script
        run: |
          pip install --quiet markdown
          python3 scripts/render-docs.py public
          cp scripts/install.sh public/install.sh
          # What the app reads from the site: where usage counts go, known app quirks and the script gallery.
          mkdir -p public/app
          cp server/endpoint.txt public/app/endpoint.txt
          cp quirks.json public/app/quirks.json
          cp -R extensions/scripts public/app/scripts
          cp scripts/perf-check.sh public/perf-check.sh
      - name: Give every page the shared head, header and footer
        # Pages carry <!--#head-->, <!--#header--> and <!--#footer-->; generated pages (changelog, docs) too.
        run: python3 scripts/site-build.py public
      - name: Copy the newest releases onto the site
        # Downloads and the app's update checks come from monorail.ashforde.org/releases/, so they
        # keep working when the repository is private.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/mirror-releases.py public/releases
      - name: Count visits and downloads on every page (count.js, no cookies)
        run: |
          find public -name '*.html' -print0 | while IFS= read -r -d '' f; do
            grep -q 'count.js' "$f" || sed -i 's#</body>#<script src="/count.js" defer></script>\n</body>#' "$f"
          done
      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on (source: GitHub Actions) the first time, if the token is allowed to.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

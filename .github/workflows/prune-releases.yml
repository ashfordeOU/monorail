name: Remove old releases

# One-off, run by hand: deletes the GitHub releases older than a version (their pages and
# downloads), so the first release anyone finds is a notarised one. Tags are kept, so the
# signed source history stays browsable. Releases at or after `keep_from` are never touched.

on:
  workflow_dispatch:
    inputs:
      keep_from:
        description: "Oldest version to keep (e.g. 1.7.16)"
        required: true
        default: "1.7.16"
      confirm:
        description: "Type DELETE to delete (anything else only lists what would go)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_FROM: ${{ github.event.inputs.keep_from }}
      CONFIRM: ${{ github.event.inputs.confirm }}
    steps:
      - name: Delete releases older than the version to keep
        run: |
          set -euo pipefail
          older() { [ "$1" != "$KEEP_FROM" ] && [ "$(printf '%s\n%s\n' "$1" "$KEEP_FROM" | sort -V | head -n1)" = "$1" ]; }
          gh release list -R "$GITHUB_REPOSITORY" --limit 500 --json tagName --jq '.[].tagName' > tags.txt
          echo "Releases now: $(wc -l < tags.txt)"
          gone=0
          while read -r tag; do
            version="${tag#v}"
            if older "$version"; then
              if [ "$CONFIRM" = "DELETE" ]; then
                gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes   # keeps the tag
                echo "Deleted release $tag (tag kept)"
              else
                echo "Would delete release $tag"
              fi
              gone=$((gone + 1))
            else
              echo "Keeping $tag"
            fi
          done < tags.txt
          echo "Releases older than $KEEP_FROM: $gone"
          [ "$CONFIRM" = "DELETE" ] && echo "Releases left: $(gh release list -R "$GITHUB_REPOSITORY" --limit 500 --json tagName --jq 'length')" || true

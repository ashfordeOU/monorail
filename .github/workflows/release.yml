name: Release

on:
  # Bumping VERSION on main publishes that version.
  push:
    branches: [main]
    paths: [VERSION]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Created from the selected branch if missing."
        required: true
      resume_run:
        description: "Finish an earlier run whose Apple review outlasted it: that run's ID (it reuses its files and submissions)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    outputs:
      tag: ${{ steps.handover.outputs.tag }}
      ready: ${{ steps.handover.outputs.ready }}
    env:
      TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
      GH_TOKEN: ${{ github.token }}
      MONORAIL_SIGNING_CERT: ${{ secrets.MONORAIL_SIGNING_CERT || secrets.MACSLIDER_SIGNING_CERT }}
      MONORAIL_SIGNING_PASSWORD: ${{ secrets.MONORAIL_SIGNING_PASSWORD || secrets.MACSLIDER_SIGNING_PASSWORD }}
      MONORAIL_INSTALLER_CERT: ${{ secrets.MONORAIL_INSTALLER_CERT }}
      MONORAIL_INSTALLER_PASSWORD: ${{ secrets.MONORAIL_INSTALLER_PASSWORD }}
      # Notarisation turns on when these are set (an Apple Developer ID certificate
      # in MONORAIL_SIGNING_CERT, plus an app-specific password for the Apple ID).
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      RESUME: ${{ github.event.inputs.resume_run || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Use the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)"
          [ -n "$latest" ] && sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
      - name: Check version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$TAG" ]; then
            TAG="v${version}"
            echo "TAG=${TAG}" >> "$GITHUB_ENV"
            # A push that didn't change to a new version: nothing to publish.
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "Release ${TAG} already exists"
              echo "SKIP=1" >> "$GITHUB_ENV"
            fi
          elif [ "v${version}" != "${TAG}" ]; then
            echo "VERSION (${version}) does not match tag ${TAG}" >&2
            exit 1
          fi
      - name: Test
        if: env.SKIP != '1' && env.RESUME == ''
        run: swift test
      - name: Import signing certificate
        # Signing with the same certificate every release keeps macOS
        # permissions across updates. See scripts/make-signing-cert.sh.
        if: env.SKIP != '1' && env.MONORAIL_SIGNING_CERT != ''
        run: scripts/ci-import-signing-cert.sh
      - name: Warn about ad-hoc signing
        if: env.SKIP != '1' && env.RESUME == '' && env.MONORAIL_SIGNING_CERT == ''
        run: echo "::warning::MONORAIL_SIGNING_CERT is not set; this release is signed ad hoc and users must re-grant Accessibility after updating."
      - name: Build app
        if: env.SKIP != '1' && env.RESUME == ''
        run: scripts/build-app.sh
      - name: Install dmgbuild
        if: env.SKIP != '1' && env.RESUME == ''
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg"
          "$RUNNER_TEMP/dmg/bin/pip" install --quiet dmgbuild
          echo "$RUNNER_TEMP/dmg/bin" >> "$GITHUB_PATH"
      - name: Package
        if: env.SKIP != '1' && env.RESUME == ''
        run: scripts/package.sh
      - name: Send to Apple
        if: env.SKIP != '1' && env.RESUME == '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        run: |
          # The DMG carries its own Developer ID signature (the app inside is signed already).
          for file in dist/*.dmg; do codesign --force --timestamp --sign "$SIGN_IDENTITY" "$file"; done
          # Both files go to Apple at once; their submission IDs are kept with the files.
          : > dist/notarisation.txt
          for file in dist/*.dmg dist/*.pkg; do
            id="$(xcrun notarytool submit "$file" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --output-format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
            echo "$(basename "$file") $id" | tee -a dist/notarisation.txt
          done
      - name: Keep the files and submissions
        # So a long first review from Apple can be finished later without sending anything again.
        if: env.SKIP != '1' && env.RESUME == '' && hashFiles('dist/notarisation.txt') != ''
        uses: actions/upload-artifact@v5
        with:
          name: release-files
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.pkg
            dist/notarisation.txt
          retention-days: 7
      - name: Get the earlier run's files
        if: env.SKIP != '1' && env.RESUME != ''
        uses: actions/download-artifact@v5
        with:
          name: release-files
          path: dist
          run-id: ${{ github.event.inputs.resume_run }}
          github-token: ${{ github.token }}
      - name: Wait for Apple
        if: env.SKIP != '1' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != '' && hashFiles('dist/notarisation.txt') != ''
        run: |
          # Up to 5 hours (a new team's first reviews can be slow), ending cleanly before GitHub's 6-hour limit.
          while read -r name id; do
            result="$(xcrun notarytool wait "$id" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --timeout 5h --output-format json || true)"
            echo "$name: $result"
            status="$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' 2>/dev/null || true)"
            if [ "$status" != "Accepted" ]; then
              xcrun notarytool log "$id" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" || true
              echo "::error::Apple hasn't accepted $name yet ($status). When it has, run Release again with resume_run = ${{ github.event.inputs.resume_run || github.run_id }}."
              exit 1
            fi
            xcrun stapler staple "dist/$name"
          done < dist/notarisation.txt
          (cd dist && shasum -a 256 *.zip *.dmg *.pkg > SHA256SUMS)
          # Check them the way macOS will: Gatekeeper must say they're notarised by Ashforde.
          for file in dist/*.dmg; do spctl -a -vvv -t open --context context:primary-signature "$file" 2>&1 | tee /dev/stderr | grep -q "Notarized Developer ID"; done
          if [ -n "${INSTALLER_IDENTITY:-}${RESUME}" ]; then
            for file in dist/*.pkg; do spctl -a -vvv -t install "$file" 2>&1 | tee /dev/stderr | grep -q "Notarized Developer ID"; done
          fi
          if [ -d dist/Monorail.app ]; then
            spctl -a -vvv -t exec dist/Monorail.app 2>&1 | tee /dev/stderr | grep -q "Notarized Developer ID" || echo "::warning::the app itself has no stapled ticket (macOS looks it up online)"
          fi
          echo "NOTARISED=1" >> "$GITHUB_ENV"
      - name: Release notes
        if: env.SKIP != '1'
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Install
          Download **Monorail-*.dmg**, drag Monorail to Applications, then open it and allow Accessibility access.
          Or install from Terminal:
          ```bash
          curl -fsSL https://raw.githubusercontent.com/ashfordeOU/monorail/main/scripts/install.sh | bash
          ```
          NOTES
          if [ "${NOTARISED:-}" != "1" ]; then
            echo "This build is not notarized. If macOS says it can't verify the developer, open **System Settings → Privacy & Security** and click **Open Anyway**." >> notes.md
          fi
      - name: Hand over to publishing
        # Publishing runs as its own job, with a fresh GitHub token however long Apple took
        # (a token from the start of a long wait can be refused).
        id: handover
        if: env.SKIP != '1'
        run: |
          cp notes.md dist/notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ready=1" >> "$GITHUB_OUTPUT"
      - name: Keep the finished files
        if: env.SKIP != '1'
        uses: actions/upload-artifact@v5
        with:
          name: release-ready
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.pkg
            dist/SHA256SUMS
            dist/notes.md
          retention-days: 7

  publish:
    needs: release
    if: needs.release.outputs.ready == '1'
    runs-on: macos-15
    env:
      TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Get the finished files
        uses: actions/download-artifact@v5
        with:
          name: release-ready
          path: dist
      - name: Check them once more
        run: |
          (cd dist && shasum -a 256 -c SHA256SUMS --ignore-missing)
          mv dist/notes.md notes.md
      - name: Publish
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.dmg dist/*.pkg dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/*.zip dist/*.dmg dist/*.pkg dist/SHA256SUMS \
              --title "Monorail ${TAG#v}" --notes-file notes.md --target "$GITHUB_SHA"
          fi
      - name: Update the Homebrew cask
        env:
          SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_KEY }}
        run: |
          version="${TAG#v}"
          sum="$(shasum -a 256 "dist/Monorail-${version}.dmg" | cut -d' ' -f1)"
          sed -i '' -e "s/^  version \".*\"/  version \"${version}\"/" -e "s/^  sha256 .*/  sha256 \"${sum}\"/" Casks/monorail.rb
          git config user.name "ashfordeOU"
          git config user.email "236818772+ashfordeOU@users.noreply.github.com"
          # Signed with Ashforde's key (the COMMIT_SIGNING_KEY secret), so it shows as Verified.
          if [ -n "${SIGNING_KEY:-}" ]; then
            key="$RUNNER_TEMP/signing_key"
            install -m 600 /dev/null "$key"
            printf '%s\n' "$SIGNING_KEY" > "$key"
            trap 'rm -f "$key"' EXIT
            git config gpg.format ssh
            git config user.signingkey "$key"
            git config commit.gpgsign true
          fi
          # MacPorts and Nix: the same version and the release zip's checksums.
          zip="dist/Monorail-${version}.zip"
          zsha="$(shasum -a 256 "$zip" | cut -d' ' -f1)"
          zrmd="$(openssl dgst -rmd160 "$zip" | awk '{print $NF}')"
          zsize="$(stat -f%z "$zip")"
          zsri="sha256-$(openssl dgst -sha256 -binary "$zip" | base64)"
          sed -i '' -E -e "s/^(github.setup +ashfordeOU monorail )[0-9.]+ v/\1${version} v/" \
            -e "s/(rmd160 +)[0-9a-f]+/\1${zrmd}/" -e "s/(sha256 +)[0-9a-f]+/\1${zsha}/" -e "s/(size +)[0-9]+/\1${zsize}/" \
            packaging/macports/aqua/monorail/Portfile
          sed -i '' -E -e "s/^(  version = \")[^\"]+/\1${version}/" -e "s#(hash = \")sha256-[^\"]+#\1${zsri}#" packaging/nix/monorail.nix
          git add Casks/monorail.rb packaging/macports/aqua/monorail/Portfile packaging/nix/monorail.nix
          git commit -m "Packages: Monorail ${version}" || exit 0
          git fetch origin main && git rebase origin/main
          git push origin HEAD:main

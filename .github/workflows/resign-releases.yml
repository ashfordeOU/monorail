# Re-signs earlier releases with Ashforde's Developer ID and notarises them (scripts/resign-release.sh).
# Picks every release whose notes still say "not notarized", so it can be run again safely.
name: Re-sign releases

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Tags to re-sign, space-separated (empty: every release not notarised yet)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.pick.outputs.tags }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: pick
        run: |
          if [ -n "${{ github.event.inputs.tags }}" ]; then
            tags="$(printf '%s\n' ${{ github.event.inputs.tags }} | jq -R . | jq -sc .)"
          else
            tags="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate \
              | jq -sc '[.[][] | select(.draft | not) | select(.body | test("not notarized")) | .tag_name]')"
          fi
          echo "Re-signing: $tags"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  resign:
    needs: list
    if: needs.list.outputs.tags != '[]'
    runs-on: macos-15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        tag: ${{ fromJson(needs.list.outputs.tags) }}
    env:
      GH_TOKEN: ${{ github.token }}
      MONORAIL_SIGNING_CERT: ${{ secrets.MONORAIL_SIGNING_CERT }}
      MONORAIL_SIGNING_PASSWORD: ${{ secrets.MONORAIL_SIGNING_PASSWORD }}
      MONORAIL_INSTALLER_CERT: ${{ secrets.MONORAIL_INSTALLER_CERT }}
      MONORAIL_INSTALLER_PASSWORD: ${{ secrets.MONORAIL_INSTALLER_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Import the Developer ID
        run: scripts/ci-import-signing-cert.sh
      - name: Re-sign and notarise ${{ matrix.tag }}
        run: scripts/resign-release.sh "${{ matrix.tag }}"

# Commits pushed to the `incoming` branch are signed with Ashforde's commit-signing key
# and then land on main, so every commit on main shows as Verified on GitHub.
#
#   COMMIT_SIGNING_KEY   repository secret: the private SSH key whose public half is a
#                        Signing Key on the ashfordeOU account (the same key as Keeper's)
#
# A push made with the workflow's own token doesn't start other workflows, so this one
# starts CI and Platforms itself, the website when site/ or assets/ changed, and the
# release when VERSION changed.
name: Sign and land

on:
  push:
    branches: [incoming]

permissions:
  contents: write
  actions: write

concurrency:
  group: sign-and-land
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-latest
    env:
      # GitHub's API sometimes answers a workflow dispatch with a 500: try a few times.
      DISPATCH: |
        dispatch() { for i in 1 2 3 4; do gh workflow run "$@" && return 0; sleep $((i * 10)); done; return 1; }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: incoming
          fetch-depth: 0
      - name: Sign the new commits and move main
        id: land
        env:
          SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          git fetch origin main
          old="$(git rev-parse origin/main)"
          if [ "$(git rev-parse HEAD)" = "$old" ]; then
            echo "incoming is main already; nothing to land."
            echo "landed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The COMMIT_SIGNING_KEY secret is not set: nothing was signed or landed."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$old" HEAD; then
            echo "::error::incoming does not build on main ($old); rebase it onto main and push again."
            exit 1
          fi
          key="$RUNNER_TEMP/signing_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          git config user.name ashfordeOU
          git config user.email 236818772+ashfordeOU@users.noreply.github.com
          git config gpg.format ssh
          git config user.signingkey "$key"
          git config commit.gpgsign true
          # Re-create each new commit with a signature; authors, dates and messages stay as they were.
          # Only ashfordeOU: drop any tool attribution lines from messages too.
          git rebase --force-rebase --exec 'git log -1 --format=%B | sed -E "/^(Co-Authored-By|Co-authored-by): .*(Claude|anthropic)/d; /^Claude-Session:/d" | git commit --amend --allow-empty --no-verify -S -F - > /dev/null' "$old"
          git log --format='%h %G? %an %s' "$old..HEAD"
          # GitHub sometimes answers a push with a passing server error: try a few times.
          for i in 1 2 3 4 5; do git push origin HEAD:main && break; [ "$i" = 5 ] && exit 1; sleep $((i * 10)); done
          # Keep incoming equal to main, so the next push builds on the signed commits.
          for i in 1 2 3; do git push --force origin HEAD:incoming && break; sleep $((i * 10)); done
          echo "landed=true" >> "$GITHUB_OUTPUT"
          changed="$(git diff --name-only "$old" HEAD)"
          if echo "$changed" | grep -qx 'VERSION'; then
            echo "release=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(site/|assets/|docs/launch/FACT-SHEET\.md|\.github/workflows/pages\.yml)'; then
            echo "pages=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Start CI and Platforms on main
        if: steps.land.outputs.landed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          eval "$DISPATCH"
          dispatch ci.yml --ref main --repo "$GITHUB_REPOSITORY"
          dispatch platforms.yml --ref main --repo "$GITHUB_REPOSITORY"
      - name: Start the website
        if: steps.land.outputs.pages == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          eval "$DISPATCH"
          dispatch pages.yml --ref main --repo "$GITHUB_REPOSITORY"
      - name: Start the release (VERSION changed)
        if: steps.land.outputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          eval "$DISPATCH"
          dispatch release.yml --ref main --repo "$GITHUB_REPOSITORY" -f tag="${{ steps.land.outputs.release }}"

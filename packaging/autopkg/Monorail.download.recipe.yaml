Description: Downloads the latest Monorail by Ashforde® installer package from monorail.ashforde.org.
Identifier: com.github.ashfordeOU.download.Monorail
MinimumVersion: "2.3"

Input:
  NAME: Monorail

Process:
  - Processor: URLTextSearcher
    Arguments:
      url: https://monorail.ashforde.org/releases/latest.json
      re_pattern: '"tag_name": *"v(?P<version>[0-9.]+)"'

  - Processor: URLDownloader
    Arguments:
      url: https://monorail.ashforde.org/releases/latest/Monorail.pkg
      filename: "%NAME%-%version%.pkg"

  - Processor: EndOfCheckPhase

  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: "%pathname%"
      expected_authority_names:
        - "Developer ID Installer: Ashforde OU (D69G45342Y)"
        - Developer ID Certification Authority
        - Apple Root CA

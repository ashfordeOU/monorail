<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Monorail design pass 1</title>
<!-- Mock-ups of the redesigned slider popover and battery panel. ?theme=dark for dark. Rendered by scripts/design/render.cjs. -->
<style>
:root {
  --bg-desk: linear-gradient(135deg,#f3d9c8,#e9c1d4 55%,#c9b8ea);
  --glass: rgba(246,242,247,.72); --glass-edge: rgba(255,255,255,.65); --hair: rgba(0,0,0,.08);
  --card: rgba(255,255,255,.62); --card-hover: rgba(255,255,255,.85);
  --ink: #1d1720; --ink-2: rgba(29,23,32,.62); --ink-3: rgba(29,23,32,.42);
  --accent: #E0447F; --accent-soft: rgba(224,68,127,.12); --green: #2FA45E; --orange: #E8812A; --track: rgba(0,0,0,.07);
  --shadow: 0 0 0 .5px rgba(0,0,0,.12), 0 24px 60px rgba(60,20,60,.22), 0 4px 14px rgba(60,20,60,.10);
}
[data-theme="dark"] {
  --bg-desk: linear-gradient(135deg,#1c1424,#33193a 55%,#141a33);
  --glass: rgba(38,30,42,.72); --glass-edge: rgba(255,255,255,.10); --hair: rgba(255,255,255,.08);
  --card: rgba(255,255,255,.06); --card-hover: rgba(255,255,255,.10);
  --ink: #F5EEF4; --ink-2: rgba(245,238,244,.66); --ink-3: rgba(245,238,244,.42);
  --accent: #F0609A; --accent-soft: rgba(240,96,154,.16); --green: #4CCB7D; --orange: #F29A4A; --track: rgba(255,255,255,.08);
  --shadow: 0 0 0 .5px rgba(255,255,255,.10), 0 24px 60px rgba(0,0,0,.55), 0 4px 14px rgba(0,0,0,.35);
}
* { box-sizing:border-box; }
html, body { margin:0; width:1500px; height:960px; overflow:hidden; font:13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", sans-serif; -webkit-font-smoothing:antialiased; color:var(--ink); }
body { background:var(--bg-desk); position:relative; }
.menubar { height:28px; background:rgba(255,255,255,.28); backdrop-filter:blur(30px); display:flex; align-items:center; padding:0 16px; gap:18px; font-weight:600; font-size:13px; }
[data-theme="dark"] .menubar { background:rgba(0,0,0,.28); color:#fff; }
.menubar .r { margin-left:auto; display:flex; gap:16px; align-items:center; font-weight:500; }
.mi { width:18px; height:14px; display:inline-grid; place-items:center; }
.label { position:absolute; font:600 12px/1 -apple-system,"Inter",sans-serif; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); }
.pane { position:absolute; border-radius:18px; background:var(--glass); backdrop-filter:blur(40px) saturate(1.6); box-shadow:var(--shadow); border:.5px solid var(--glass-edge); overflow:hidden; }
.pad { padding:12px; }
.row { display:flex; align-items:center; gap:8px; }
.title { font-weight:700; font-size:14px; letter-spacing:-.1px; }
.sub { color:var(--ink-2); font-size:12px; }
.tiny { color:var(--ink-3); font-size:11px; }
.card { background:var(--card); border-radius:12px; padding:10px 12px; }
.card + .card { margin-top:8px; }
.icon-btn { width:28px; height:28px; border-radius:8px; display:grid; place-items:center; color:var(--ink-2); }
.icon-btn.on { color:var(--orange); }
.icon-btn:hover, .icon-btn.hover { background:var(--card-hover); }
svg.sf { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.seg { display:inline-flex; background:var(--track); border-radius:7px; padding:2px; font-size:11.5px; font-weight:600; }
.seg span { padding:3px 10px; border-radius:5px; color:var(--ink-2); }
.seg span.on { background:var(--glass-edge); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12); }
[data-theme="dark"] .seg span.on { background:rgba(255,255,255,.16); }
.chip { display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:999px; background:var(--card); font-size:11.5px; font-weight:600; color:var(--ink-2); }
.chip.warn { color:var(--orange); background:rgba(232,129,42,.12); }
.big { font:650 22px/1.05 -apple-system,"SF Pro Display","Inter",sans-serif; letter-spacing:-.4px; font-variant-numeric:tabular-nums; }
.btn { display:inline-flex; align-items:center; padding:4px 11px; border-radius:7px; font-size:12px; font-weight:600; background:var(--card-hover); color:var(--ink); box-shadow:0 0 0 .5px var(--hair); }
.btn.p { background:var(--accent); color:#fff; box-shadow:none; }
.btn.q { background:none; box-shadow:none; color:var(--ink-2); }
.bar { height:6px; border-radius:3px; background:var(--track); overflow:hidden; }
.bar i { display:block; height:100%; border-radius:3px; background:var(--accent); }
.toggle { width:30px; height:18px; border-radius:9px; background:var(--track); position:relative; }
.toggle i { position:absolute; left:2px; top:2px; width:14px; height:14px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.3); }
.toggle.on { background:var(--green); } .toggle.on i { left:14px; }
.slidecard { width:118px; flex:0 0 118px; }
.thumb { height:70px; border-radius:9px; background:var(--card); display:grid; place-items:center; position:relative; box-shadow:inset 0 0 0 .5px var(--hair); }
.thumb.on { box-shadow:0 0 0 2px var(--accent); }
.appicon { width:24px; height:24px; border-radius:6px; }
.dot { width:6px; height:6px; border-radius:50%; background:var(--ink-3); }
.dot.on { background:var(--accent); width:16px; border-radius:3px; }
.strip { display:flex; gap:6px; padding:8px; border-radius:12px; background:var(--card); align-items:center; }
.strip .s { height:30px; border-radius:7px; flex:1; background:var(--track); }
.strip .s.on { background:var(--accent-soft); box-shadow:inset 0 0 0 1.5px var(--accent); }
.handle { color:var(--ink-3); }
.editcard { border-radius:12px; box-shadow:0 0 0 1px var(--accent-soft); background:var(--card); padding:6px 8px 8px; }
.editcard + .editcard { margin-top:8px; }
.editbar { display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; color:var(--ink-2); padding:2px 2px 6px; }
.minus { width:15px; height:15px; border-radius:50%; background:#E5484D; color:#fff; display:grid; place-items:center; font-weight:900; font-size:12px; line-height:1; }
</style></head>
<body>
<div class="menubar"><span></span><span>Finder</span><span style="font-weight:400">File</span><span style="font-weight:400">Edit</span><span style="font-weight:400">View</span>
  <div class="r"><span class="mi" id="mr-icon"></span><span>Wed 12 Nov 21:54</span></div></div>
<div id="app"></div>
<script>
const theme = new URLSearchParams(location.search).get('theme') || 'light';
document.documentElement.dataset.theme = theme;
const sf = {
  palette: '<path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.6-.9 1.2-1.8-.5-1-.1-2.2 1.3-2.2H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/>',
  bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  cup: '<path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3v3M12 3v3"/>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
  wand: '<path d="m4 20 11-11"/><path d="m14 6 1-3 1 3 3 1-3 1-1 3-1-3-3-1z"/>',
  pause: '<path d="M8 5v14M16 5v14"/>',
  grid: '<rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  stack: '<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  leaf: '<path d="M5 19c0-8 6-14 15-14 0 9-6 15-14 15"/><path d="M5 19 13 11"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  sparkles: '<path d="m12 3 1.8 4.7L18.5 9.5 13.8 11.3 12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>',
  layers: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M9 5v14"/>',
  scope: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
  up: '<path d="M12 19V5M6 11l6-6 6 6"/>', down: '<path d="M12 5v14M6 13l6 6 6-6"/>', lines: '<path d="M4 8h16M4 12h16M4 16h16"/>',
  battery: '<rect x="2.5" y="7" width="17" height="10" rx="2.5"/><path d="M21.5 10.5v3"/><rect x="5" y="9.5" width="7" height="5" rx="1" fill="currentColor" stroke="none"/>',
};
const ic = (n, cls = '') => `<svg class="sf ${cls}" viewBox="0 0 24 24">${sf[n]}</svg>`;
const app = document.getElementById('app');
const icons = { Safari: '#3B8BF6', Slack: '#7B3FE4', Xcode: '#1D7FF2', Mail: '#3AA0F4', Chrome: '#F2B33D', Figma: '#F24E1E', Claude: '#D97757', Notes: '#F5C443' };
const appIcon = (name, s = 24) => `<span class="appicon" style="width:${s}px;height:${s}px;background:linear-gradient(140deg, ${icons[name] || '#999'}, color-mix(in srgb, ${icons[name] || '#999'} 60%, #000))"></span>`;
document.getElementById('mr-icon').innerHTML = `<svg viewBox="0 0 18 14" width="18" height="14"><rect x="1" y="1" width="4" height="12" rx="1.5" fill="currentColor"/><rect x="13" y="1" width="4" height="12" rx="1.5" fill="currentColor"/><rect x="7" y="4" width="4" height="7" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>`;

// 1. The slider popover
const popover = `
<div class="label" style="left:40px;top:58px">Slider popover</div>
<div class="pane" style="left:40px;top:80px;width:560px">
  <div class="pad">
    <div class="row" style="margin-bottom:10px">
      <div class="title">Workspace 1</div><div class="sub">· 6 slides</div>
      <div style="margin-left:auto" class="row" >
        <span class="icon-btn">${ic('palette')}</span><span class="icon-btn on">${ic('bolt')}</span><span class="icon-btn on">${ic('cup')}</span>
        <span class="icon-btn on">${ic('moon')}</span><span class="icon-btn">${ic('wand')}</span><span class="icon-btn">${ic('pause')}</span>
        <span class="icon-btn">${ic('grid')}</span><span class="icon-btn">${ic('gear')}</span>
      </div>
    </div>
    <div class="strip"><span class="dot on"></span><span class="dot"></span><span class="dot"></span>
      <div class="s"></div><div class="s on"></div><div class="s"></div><div class="s"></div><div class="s"></div><div class="s"></div></div>
    <div class="row" style="gap:8px;margin:10px 0 2px;overflow:hidden">
      ${[['Safari', 'Safari · Monorail', 0], ['Xcode', 'Engine.swift', 1], ['Slack', '#launch', 0], ['Chrome', 'Product Hunt', 0], ['Claude', 'Claude Code', 0]].map(([a, t, on]) => `
      <div class="slidecard"><div class="thumb ${on ? 'on' : ''}">${appIcon(a, 28)}</div><div class="tiny" style="margin-top:5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><b style="color:var(--ink)">${a}</b> ${t}</div></div>`).join('')}
    </div>
  </div>
  <div class="row" style="padding:8px 12px;border-top:.5px solid var(--hair);gap:6px">
    <span class="chip">${ic('battery')} 64% · Chrome</span><span class="chip">${ic('layers')} Layouts</span><span class="chip">${ic('scope')} Focus</span>
    <span class="chip warn">⚠︎ 1 shortcut clash</span><span style="margin-left:auto" class="tiny">⌃⌥← → to slide</span>
  </div>
</div>`;

// 2. The battery panel
const history = (() => {
  const pts = [[0, 30], [40, 34], [80, 40], [100, 48], [125, 26], [150, 12], [190, 16], [240, 24], [290, 31], [318, 36]];
  const seg = (a, b, col) => `<polyline points="${pts.slice(a, b).map(p => p.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
  return `<svg viewBox="0 0 320 96" width="100%" height="84"><line x1="0" y1="10" x2="320" y2="10" stroke="var(--hair)"/><line x1="0" y1="50" x2="320" y2="50" stroke="var(--hair)"/><line x1="0" y1="90" x2="320" y2="90" stroke="var(--hair)"/>
    ${seg(0, 4, 'var(--accent)')}${seg(3, 6, 'var(--green)')}${seg(5, 10, 'var(--accent)')}<circle cx="318" cy="36" r="3.5" fill="var(--accent)"/></svg>`;
})();
const battery = `
<div class="label" style="left:640px;top:58px">Battery panel</div>
<div class="pane" style="left:640px;top:80px;width:360px">
  <div class="row pad" style="padding-bottom:6px"><span style="width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#FF8A5B,#E8437A 55%,#8E3AB8)">${ic('bolt')}</span>
    <div class="title">Battery</div><span style="margin-left:auto" class="icon-btn">${ic('stack')}</span><span class="icon-btn">${ic('gear')}</span></div>
  <div style="padding:0 12px 12px">
    <div class="card" style="display:grid;grid-template-columns:repeat(3,1fr);text-align:left;gap:6px">
      <div><div class="tiny">Battery</div><div class="big">64%</div><div class="tiny">On battery</div></div>
      <div><div class="tiny">Time left</div><div class="big">5:52</div><div class="tiny">At this rate</div></div>
      <div><div class="tiny">Using</div><div class="big">6.1<span style="font-size:13px;font-weight:600"> W</span></div><div class="tiny">Whole Mac</div></div>
    </div>
    <div class="card row" style="margin-top:8px"><span style="color:var(--green)">${ic('leaf')}</span><div><div style="font-weight:600">Low Power Mode</div></div><span class="toggle" style="margin-left:auto"><i></i></span></div>
    <div class="card" style="margin-top:8px">
      <div class="row"><div style="font-weight:600">Since last charge</div><span class="tiny" style="margin-left:auto">unplugged 18:26 at 100%</span></div>
      <div class="row" style="margin-top:8px">${appIcon('Chrome', 22)}<div><div class="tiny">Top drainer</div><div style="font-weight:650">Google Chrome</div></div><div style="margin-left:auto;font-weight:650">4.2%</div></div>
      <div class="row tiny" style="margin-top:6px"><span style="color:var(--ink-2)">${ic('sparkles')}</span> Claude Code <span style="margin-left:auto">1.8%</span></div>
      <div class="row tiny" style="margin-top:3px"><span style="width:16px"></span> Codex <span style="margin-left:auto">0.9%</span></div>
    </div>
    <div class="card" style="margin-top:8px">
      <div class="row"><div style="font-weight:600">History</div><span class="seg" style="margin-left:auto"><span class="on">24 h</span><span>Since charge</span></span></div>
      ${history}
      <div class="row tiny"><span>Health 100%</span><span style="margin-left:auto">5 cycles</span></div>
    </div>
    <div class="card" style="margin-top:8px;background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft)),var(--card)">
      <div class="row">${appIcon('Chrome', 22)}<div><div class="tiny" style="color:var(--accent);font-weight:700">Needs your attention</div><div style="font-weight:650">Google Chrome · 6.2%/hr</div></div></div>
      <div class="row" style="margin-top:8px"><span class="btn p">Quit</span><span class="btn">Pause</span><span class="btn q">Keep</span><span class="tiny" style="margin-left:auto">+49 min if you quit</span></div>
    </div>
    <div class="card" style="margin-top:8px">
      <div class="row" style="margin-bottom:6px"><div style="font-weight:600">Apps</div><span class="seg" style="margin-left:auto"><span class="on">Top</span><span>All</span></span></div>
      ${[['Chrome', 'Google Chrome', 21, 0.95, '6.2%/hr'], ['Claude', 'Claude', 12, .45, '2.1%/hr'], ['Xcode', 'Xcode', 10, .22, '0.9%/hr'], ['Slack', 'Slack', 6, .1, '0.4%/hr']].map(([a, n, p, f, r]) => `
      <div class="row" style="padding:5px 0">${appIcon(a, 20)}<div style="flex:1;min-width:0"><div style="font-weight:550">${n}</div><div class="bar" style="margin-top:3px;width:90%"><i style="width:${f * 100}%"></i></div></div><div style="font-variant-numeric:tabular-nums;font-weight:600;width:62px;text-align:right">${r}</div></div>`).join('')}
    </div>
  </div>
  <div class="row" style="padding:8px 12px;border-top:.5px solid var(--hair);color:var(--ink-3)">${ic('search')}<span>Search apps</span><span style="margin-left:auto;font-size:11px">⌘F</span></div>
</div>`;

// 3. Arranging the battery panel
const arrange = `
<div class="label" style="left:1040px;top:58px">Arranging cards</div>
<div class="pane" style="left:1040px;top:80px;width:360px">
  <div class="row pad" style="padding-bottom:6px"><div class="title">Arrange</div><span class="sub">Drag, hide or add cards</span></div>
  <div style="padding:0 12px 12px">
    ${[['AI agents', 'Claude Code 1.8% · Codex 0.9% since charge'], ['Since last charge', 'Google Chrome 4.2%'], ['Battery, time left and draw', '64% · 5:52 · 6.1 W'], ['History', '24 hours'], ['Apps', 'Top 5']].map(([t, d], i) => `
    <div class="editcard" style="${i === 0 ? 'box-shadow:0 0 0 2px var(--accent),0 10px 24px rgba(0,0,0,.15);transform:translateX(6px) rotate(-.6deg)' : ''}">
      <div class="editbar"><span class="handle">${ic('lines')}</span><span class="minus">−</span><span>${t}</span><span style="margin-left:auto" class="handle">${ic('up')}</span><span class="handle">${ic('down')}</span></div>
      <div class="tiny" style="padding:0 4px 2px;color:var(--ink-2)">${d}</div></div>`).join('')}
  </div>
  <div class="row" style="padding:8px 12px;border-top:.5px solid var(--hair)"><span class="btn q">+ Add Card</span><span class="btn q">Reset</span><span class="btn p" style="margin-left:auto">Done</span></div>
</div>`;

const notes = `
<div class="abs" style="position:absolute;left:40px;top:480px;width:560px;font-size:12.5px;color:var(--ink-2);line-height:1.55">
  <div class="label" style="position:static;margin-bottom:8px">What changes</div>
  • One translucent material for every Monorail panel, with a hairline edge and soft shadow (Liquid Glass on macOS 26).<br>
  • One card style: 12 pt corners, the same padding, no borders. Numbers big, labels small and quiet.<br>
  • One accent (Monorail pink) for “on” and the main action; orange only for warnings; green only for charging and good news.<br>
  • Icon buttons in one row, 28 pt targets with a hover fill; orange when that feature is on.<br>
  • Fewer words: hints move into tooltips; buttons say one word (Quit, Pause, Keep).<br>
  • Gentle spring animations as cards move or numbers change; nothing moves with Reduce Motion on.<br>
  • The menu bar icon: one template glyph, with small state marks (paused, warning, awake).
</div>`;
app.innerHTML = popover + battery + arrange + notes;
</script></body></html>

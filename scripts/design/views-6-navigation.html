<!doctype html><html lang="en"><head><meta charset="utf-8"><title>One panel</title><link rel="stylesheet" href="mac.css">
<style>
.step { position:absolute; font-size:22px; color:var(--ink-3); }
.back { color:var(--blue); display:flex; align-items:center; gap:2px; font-weight:500; }
.mod { display:flex; align-items:center; gap:9px; }
.ghost { opacity:.35; filter:blur(.3px); }
</style></head>
<body><div id="app"></div><script src="mac.js"></script><script>
const home = (x, y, hi = '') => `<div class="panel" style="left:${x}px;top:${y}px;width:330px">
  <div class="tile"><div class="row" style="margin-bottom:8px"><span class="b">Workspace 1</span><span class="t3">· 5 slides</span></div>
    <div style="display:flex;gap:6px">${[['Claude'], ['Claude'], ['Safari'], ['Chrome']].map((a, i) => `<div style="flex:1;height:52px;border-radius:8px;display:grid;place-items:center;background:${i === 0 ? 'var(--tile-2)' : 'var(--tile)'};${i === 0 ? 'box-shadow:0 0 0 2px var(--blue)' : ''}">${app(a[0], 18)}</div>`).join('')}</div></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
    <div class="tile mod"><span class="round warm">${s('cup')}</span><div><div class="b">Stay Awake</div><div class="t2">Off</div></div></div>
    <div class="tile mod"><span class="round warm">${s('moon', 'f')}</span><div><div class="b">Evening</div><div class="t2">On</div></div></div>
    <div class="tile mod"><span class="round">${s('scope')}</span><div><div class="b">Focus</div><div class="t2">Off</div></div></div>
    <div class="tile mod" style="${hi}"><span class="round" style="background:var(--good);color:#fff">${s('bolt', 'f')}</span><div><div class="b">Battery</div><div class="t2 num">62% · 1:32</div></div><span style="margin-left:auto;color:var(--ink-3)">${s('chev')}</span></div>
  </div></div>`;

const battery = (x, y) => `<div class="panel" style="left:${x}px;top:${y}px;width:330px">
  <div class="row" style="margin:2px 2px 10px"><span class="back">${s('chev').replace('<path d="m9 6 6 6-6 6"/>', '<path d="m15 6-6 6 6 6"/>')}Monorail</span><span class="b" style="margin-left:auto;margin-right:auto;transform:translateX(-30px)">Battery</span></div>
  <div class="tile" style="display:flex;justify-content:space-around;padding:12px 4px">
    ${[[62, 'var(--good)', '62%', 'Charge'], [36, 'var(--ok)', '1:32', 'Left'], [84, 'var(--good)', '84%', 'Health']].map(([p, c, v, l]) => `<div style="text-align:center"><div style="display:grid;place-items:center">${ring(p, c, 52, 5)}</div><div class="num b" style="margin-top:4px">${v}</div><div class="t3">${l}</div></div>`).join('')}
  </div>
  <div class="tile row" style="margin-top:8px;background:color-mix(in srgb,var(--ok) 12%,var(--tile))"><span style="color:var(--ok)">${s('bolt', 'f')}</span><div><div class="b">Using 28.8 W, about 4× your usual</div><div class="t2">Low Power Mode is on. Quitting Safari gives 9 min.</div></div></div>
  <div class="h">Using Significant Energy</div>
  <div class="list">${[['Safari', '0.2%/h'], ['Firefox', '<0.1%/h'], ['Chrome', '<0.1%/h']].map(([a, v]) => `<div class="li ic">${app(a)}<span>${a}</span><span class="v num">${v}</span><span style="color:var(--ink-3)">${s('chev')}</span></div>`).join('')}</div>
  <div class="row" style="margin-top:10px"><span class="t3">Show in menu bar</span><span class="switch"><i></i></span></div>
</div>`;

const detail = (x, y) => `<div class="panel" style="left:${x}px;top:${y}px;width:330px">
  <div class="row" style="margin:2px 2px 10px"><span class="back">${s('chev').replace('<path d="m9 6 6 6-6 6"/>', '<path d="m15 6-6 6 6 6"/>')}Battery</span><span class="b" style="margin-left:auto;margin-right:auto;transform:translateX(-26px)">Safari</span></div>
  <div class="tile"><div class="row">${app('Safari', 28)}<div><div class="b">Safari</div><div class="t3">1 process · 2 windows</div></div></div>
    <div class="row" style="gap:18px;margin-top:10px"><div><div class="num b" style="font-size:20px">0.16 W</div><div class="t3">now</div></div><div><div class="num b" style="font-size:20px">0.2%</div><div class="t3">an hour</div></div><div><div class="num b" style="font-size:20px">1.1%</div><div class="t3">since charge</div></div></div></div>
  <div class="h">Windows</div>
  <div class="list"><div class="li ic">${app('Safari')}Monorail — Docs<span class="v">0.1 W</span></div><div class="li ic">${app('Safari')}Product Hunt<span class="v">0.06 W</span></div></div>
  <div class="row" style="margin-top:10px"><span class="btn p">Quit</span><span class="btn">Pause</span><span class="btn">Hide</span><span class="btn" style="margin-left:auto">Show Windows</span></div>
</div>`;

const arrow = (x, y, t) => `<div class="step" style="left:${x}px;top:${y}px">→</div><div class="t3" style="position:absolute;left:${x - 30}px;top:${y + 32}px;width:90px;text-align:center">${t}</div>`;
document.getElementById('app').innerHTML = menubar(`<span class="on">${monoIcon}</span><span>⚡ 62%</span>`)
  + `<div class="cap" style="left:40px;top:44px">ONE PANEL, PAGES INSIDE IT (LIKE CONTROL CENTRE)</div>`
  + home(40, 70, 'box-shadow:0 0 0 2px var(--blue)')
  + arrow(392, 200, 'click Battery')
  + battery(440, 70)
  + arrow(792, 200, 'click an app')
  + detail(840, 70)
  + `<div class="notes" style="left:1200px;top:70px;width:270px">
     <b>No popover on a popover.</b> The Monorail panel itself turns into the Battery page: the modules slide away, the page slides in, and the panel smoothly grows or shrinks to fit. ‹ Monorail goes back.<br><br>
     <b>The same page everywhere.</b> The ⚡ menu bar item opens this panel straight at Battery; Stay Awake, Evening, Theme and Layouts open the same way.<br><br>
     <b>Keyboard too.</b> ⌘[ goes back, ⎋ closes, ⌘F searches the page.<br><br>
     <b>Settings stay in Settings.</b> “More Battery Settings…” opens the Settings window at Battery and closes the panel.</div>`;
</script></body></html>
